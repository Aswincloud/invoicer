# Runs the test suites on every pull request, in the merge queue, and on master.
# The "Tests" check is required by the master ruleset, so the merge queue cannot
# merge a PR whose suites fail. Deploys are not done here: Workers Builds
# deploys master on push (see README → Deploying).
name: Tests
on:
  pull_request:
  merge_group:
  push:
    branches: [master]
# Read-only token: the job checks out code and runs tests, nothing else.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
