# Runs the test suites on every pull request, in the merge queue, and on master.
# The "Tests" check is required by the master ruleset, so the merge queue cannot
# merge a PR whose suites fail. Deploys are not done here: Workers Builds
# deploys master on push (see README → Deploying).
name: Tests
on:
  pull_request:
  merge_group:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
