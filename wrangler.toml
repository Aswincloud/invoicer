name = "invoicer"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Static site served from ./public; Worker handles /api/* (non-asset paths).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "invoicer-db"
database_id = "6e9cc928-6f49-4ea6-a59a-f64de796ad01"

# Every 30 minutes: check shipped-not-delivered parcels on ShipTrack and send
# the customer the delivered message when one has arrived. See src/shipment.js.
[triggers]
crons = ["*/30 * * * *"]

[vars]
APP_NAME = "Invoicer"
RESEND_FROM_EMAIL = "notify@aswincloud.com"
APP_BASE_URL = "https://invoicer.aswincloud.com"

# Live parcel status and the customer's tracking links come from ShipTrack's
# public API. No credentials; its /api/track is open.
SHIPTRACK_BASE_URL = "https://shiptrack.aswincloud.com"

# Invoices raised automatically from paid orders at 3d-prints.aswincloud.com.
#
# Kill switch: set to "false" and deploy to stop accepting them, without touching
# the shop. Checked before any work, so a disabled endpoint writes nothing.
SHOP_INGEST_ENABLED = "true"

# Whose business appears on an auto-raised invoice. Read from config, never from
# the request — otherwise the caller would choose whose name is on the document.
# Must match an existing Invoicer account with its business profile filled in.
INVOICE_OWNER_EMAIL = "aswin@aswincloud.com"

# Print a receipt on the thermal printer at the office. The printer is Bluetooth
# and unreachable from here, so POST /api/print forwards the PDF to a relay on
# that LAN over the cloudflared tunnel.
#
# Kill switch: set to "false" and deploy to stop printing. The POS receipt button
# then just downloads the PDF, as it did before.
PRINT_ENABLED = "true"
PRINT_RELAY_URL = "https://print.aswincloud.com/print"

# Shareable invoice links paid online with Razorpay: /i/<token> renders the
# invoice for a client who has no account, and Razorpay's order.paid webhook
# marks it PAID.
#
# Kill switch: set to "false" and deploy to stop taking payments. The link still
# opens and the invoice still renders — only the Pay button goes away.
PAY_ENABLED = "true"

# The public "pay me" page at /pay: a stranger enters name, mobile, what for and
# how much, and pays with Razorpay. Nothing is written until the webhook sees the
# payment. Bounds in rupees; PAYLINK_ENABLED = "false" hides the form.
PAYLINK_ENABLED = "true"
# /pay bills as this business (by name); the shop's orders keep the default.
PAYLINK_BUSINESS = "AswinCloud"
# The template a /pay payment's WhatsApp uses — a plain receipt, not the shop's
# "order confirmed". Created 2026-09-26 on the WABA; see src/wa.js.
WA_TEMPLATE_RECEIPT = "payment_received"
PAYLINK_MIN = "10"
PAYLINK_MAX = "50000"
# TURNSTILE_SITE_KEY here (public) + TURNSTILE_SECRET as a secret turn on the
# bot check on /pay. Both absent = form works with no check.

# Secrets (NOT here — set once via API/dashboard, never committed):
#   RESEND_API_KEY, AUTH_SIGNING_KEY
#   SHOP_INGEST_SECRET — shared with the shop Worker; signs POST /api/ingest/order.
#                        Must match the secret of the same name in 3d_printing.
#   INVOICER_CHAT_SECRET — shared with the support bot (offhours-bot in the
#                        chatwoot repo); signs POST /api/chat/shipments, the
#                        lookup that answers "where is my parcel?" on WhatsApp.
#   WA_PHONE_NUMBER_ID / WA_ACCESS_TOKEN — the WhatsApp number these messages go
#                        out from. Must be the number Chatwoot answers on
#                        (+91 413 235 7944, id 1336188189573573), or a customer's
#                        reply to an invoice lands with the wrong bot.
#   WA_TEMPLATE_CONFIRMED / WA_TEMPLATE_SHIPPED / WA_TEMPLATE_DELIVERED — optional;
#                        default to order_confirmed_new / order_shipped_link /
#                        order_delivered_new on the WABA.
#   WA_SHIPPED_BUTTON_BASE — optional; fixed prefix of order_shipped_link's URL
#                        button, default https://shiptrack.aswincloud.com/track/ .
#   PRINT_RELAY_SECRET — shared with the print relay; signs POST to PRINT_RELAY_URL.
#                        Must match PRINT_RELAY_SECRET in /etc/tejprint-relay.env
#                        on the machine running tejprint-relay.py.
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET — the API key pair. Same Razorpay
#                        account as the shop; KEY_SECRET never leaves the Worker.
#   RAZORPAY_WEBHOOK_SECRET — a DIFFERENT string, typed into the Razorpay
#                        dashboard when creating this Worker's webhook. Signs the
#                        webhook body. Mixing it up with KEY_SECRET is the
#                        classic Razorpay bug; see src/razorpay.js.
